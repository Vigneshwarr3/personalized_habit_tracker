# Run from the repo root on the server:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Both services listen on 127.0.0.1 only. `tailscale serve` publishes them to the tailnet (never Funnel):
#   https://your-server.your-tailnet.ts.net:8765  -> api
#   https://your-server.your-tailnet.ts.net:8501  -> dashboard
name: habit-tracker

services:
  api:
    build: {context: .., dockerfile: deploy/Dockerfile}
    image: habit-tracker:latest
    pull_policy: build          # local image, never pulled from Docker Hub
    command: ["uvicorn", "--factory", "server.app.main:app_factory", "--host", "0.0.0.0", "--port", "8765",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file: ../.env
    environment:
      HT_DIST_DIR: /app/dist
    volumes:
      - ../data:/app/data                       # SQLite + backups (never deleted)
      - ../dist:/app/dist:ro                    # Android app served to the phone's "Check for update"
      - ../server/config:/app/server/config:ro  # edit YAML on the server, then: docker compose restart api
    ports: ["127.0.0.1:18765:8765"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 60s
      timeout: 5s
      retries: 3

  dashboard:
    image: habit-tracker:latest
    pull_policy: never          # same image the api service builds
    depends_on: [api]
    working_dir: /app/dashboard
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8501",
              "--server.headless", "true", "--browser.gatherUsageStats", "false",
              "--server.fileWatcherType", "none", "--client.toolbarMode", "minimal"]
    env_file: ../.env
    environment:
      HT_API_URL: http://api:8765
      HT_APK_PATH: /app/dist/habit-tracker.apk
    volumes:
      - ../dist:/app/dist:ro                    # Android app offered for download on Privacy & devices
    ports: ["127.0.0.1:18501:8501"]
    restart: unless-stopped
